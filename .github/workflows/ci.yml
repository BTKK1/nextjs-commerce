name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      live_agent_suite:
        description: "Run the real OX Alpha agent quality suite"
        required: false
        default: false
        type: boolean
      live_commerce_chat:
        description: "Run one real product-grounded chat on Salla and Zid"
        required: false
        default: false
        type: boolean

concurrency:
  group: nbeh-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AGENT_MODE: live
      AGENT_QUALITY_MODE: live
      NEXT_PUBLIC_DEMO_MODE: "true"
      DATA_BACKEND: local
      SUPABASE_AGENT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate and seed demo data
        run: pnpm run generate:demo-assets && pnpm run seed:demo

      - name: Static and backend checks
        run: pnpm run secrets:check && pnpm run backend:check && pnpm run db:types && pnpm run lint && pnpm run typecheck

      - name: Deterministic provider-boundary tests
        run: pnpm run test:unit && pnpm run test:integration

      - name: Production build
        run: pnpm run build

      - name: Non-agent browser coverage
        env:
          AGENT_TEST_PROVIDER: deterministic
          AGENT_TEST_RUNTIME: browser-ci
          PLAYWRIGHT_USE_BUILD_SERVER: "1"
        run: pnpm run test:e2e:product-pages && pnpm run test:e2e:agent && pnpm run test:e2e:dashboard

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload agent quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-report
          path: |
            AGENT_QUALITY_REPORT.md
            AGENT_QUALITY_REPORT.json
            .local/agent-quality-results.json
            SCREENSHOT_AUDIT.md
            PRODUCT_PAGE_AUDIT.md
            DASHBOARD_AUDIT.md
            HANDOFF_REPORT.md
            .codex-loop/
          if-no-files-found: ignore

  live-agent-smoke:
    name: Continuous OX Alpha agent quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_agent_suite) }}
    env:
      AGENT_MODE: live
      NEXT_PUBLIC_DEMO_MODE: "true"
      DATA_BACKEND: local
      SUPABASE_AGENT_ENABLED: "false"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CONTINUOUS_TEST_MODEL: stealth/ox-alpha
      SALES_AGENT_MODEL: stealth/ox-alpha
      SALES_AGENT_DISABLE_FALLBACKS: "true"
      PRODUCT_AGENT_DISABLE_FALLBACKS: "true"
      PRODUCT_AGENT_TIMEOUT_MS: "120000"
      PRODUCT_AGENT_SAME_ROUTE_RETRIES: "3"
      PRODUCT_AGENT_RETRY_BASE_MS: "5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OX Alpha is the only configured route
        run: |
          node --import ts-node/esm -e "import('./src/lib/ai/model-config.ts').then(({getModelConfig}) => { const routes = getModelConfig().routes; if (routes.length !== 1 || routes[0].provider !== 'openrouter' || routes[0].model !== 'stealth/ox-alpha') throw new Error('Continuous test model route is not locked to OX Alpha'); console.log('Model route locked to OpenRouter:stealth/ox-alpha'); })"

      - name: Continuous OX Alpha smoke
        id: ox_alpha_smoke
        continue-on-error: true
        run: pnpm run test:agent:continuous

      - name: Record OX Alpha monitor result
        if: always()
        run: |
          echo "### OX Alpha continuous monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.ox_alpha_smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Configured route: OpenRouter stealth/ox-alpha only; model fallback disabled." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ox_alpha_smoke.outcome }}" != "success" ]; then
            echo "OX Alpha did not complete a live product-grounded response. Inspect the failed step for upstream timeout, rate-limit, authentication, or response-quality details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Full live OX Alpha agent quality suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_agent_suite }}
        run: pnpm run test:agent:live

      - name: Upload live agent quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-quality-report
          path: |
            AGENT_QUALITY_REPORT.md
            .local/agent-quality-results.json
          if-no-files-found: ignore

  production-commerce-gate:
    name: Production Salla + Zid gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    environment: production
    env:
      EXPECTED_GIT_SHA: ${{ github.sha }}
      PRODUCTION_SMOKE_URL: https://www.nbeh.io
      PRODUCTION_COMMERCE_LIVE_CHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.live_commerce_chat && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for deployed commit and verify Salla + Zid
        run: node scripts/verify-production-commerce.mjs
