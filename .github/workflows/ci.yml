name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:
    inputs:
      live_agent_suite:
        description: "Run the full live GLM 5.3 Flash agent quality suite"
        required: false
        default: false
        type: boolean
      live_commerce_chat:
        description: "Run one real product-grounded chat on Salla and Zid"
        required: false
        default: false
        type: boolean

concurrency:
  group: nbeh-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AGENT_MODE: live
      AGENT_QUALITY_MODE: live
      NEXT_PUBLIC_DEMO_MODE: "true"
      DATA_BACKEND: local
      SUPABASE_AGENT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate and seed demo data
        run: pnpm run generate:demo-assets && pnpm run seed:demo

      - name: Static and backend checks
        run: pnpm run secrets:check && pnpm run backend:check && pnpm run db:types && pnpm run lint && pnpm run typecheck

      - name: Deterministic provider-boundary tests
        run: pnpm run test:unit && pnpm run test:integration

      - name: Production build
        run: pnpm run build

      - name: Non-agent browser coverage
        env:
          AGENT_TEST_PROVIDER: deterministic
          AGENT_TEST_RUNTIME: browser-ci
          PLAYWRIGHT_USE_BUILD_SERVER: "1"
        run: pnpm run test:e2e:product-pages && pnpm run test:e2e:agent && pnpm run test:e2e:dashboard

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload agent quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-report
          path: |
            AGENT_QUALITY_REPORT.md
            AGENT_QUALITY_REPORT.json
            .local/agent-quality-results.json
            SCREENSHOT_AUDIT.md
            PRODUCT_PAGE_AUDIT.md
            DASHBOARD_AUDIT.md
            HANDOFF_REPORT.md
            .codex-loop/
          if-no-files-found: ignore

  live-agent-smoke:
    name: Continuous GLM 5.3 Flash agent quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    env:
      AGENT_MODE: live
      NEXT_PUBLIC_DEMO_MODE: "true"
      DATA_BACKEND: local
      SUPABASE_AGENT_ENABLED: "false"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_ENFORCE_KEY_SHA256: "true"
      OPENROUTER_KEY_SHA256: ${{ vars.OPENROUTER_KEY_SHA256 }}
      CONTINUOUS_TEST_MODEL: z-ai/glm-5.3-flash
      SALES_AGENT_MODEL: z-ai/glm-5.3-flash
      SALES_AGENT_DISABLE_FALLBACKS: "true"
      PRODUCT_AGENT_DISABLE_FALLBACKS: "true"
      PRODUCT_AGENT_TIMEOUT_MS: "120000"
      PRODUCT_AGENT_SAME_ROUTE_RETRIES: "3"
      PRODUCT_AGENT_RETRY_BASE_MS: "5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify GLM 5.3 Flash is the only configured route
        run: |
          node --import ts-node/esm -e "import('./src/lib/ai/model-config.ts').then(({getModelConfig}) => { const config = getModelConfig(); const routes = config.routes; if (!config.credentialGuardEnabled) throw new Error('Saleh OpenRouter credential guard is disabled'); if (routes.length !== 1 || routes[0].provider !== 'openrouter' || routes[0].model !== 'z-ai/glm-5.3-flash') throw new Error('Continuous test model route is not locked to GLM 5.3 Flash'); console.log('Saleh credential guard active; model route locked to OpenRouter:z-ai/glm-5.3-flash'); })"

      - name: Continuous GLM 5.3 Flash smoke
        id: production_model_smoke
        run: pnpm run test:agent:continuous

      - name: Record production-model monitor result
        if: always()
        run: |
          echo "### GLM 5.3 Flash continuous monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.production_model_smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Configured route: OpenRouter z-ai/glm-5.3-flash only; model fallback disabled." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.production_model_smoke.outcome }}" != "success" ]; then
            echo "The production model did not complete a live product-grounded response. Inspect the failed step for upstream retirement, timeout, rate-limit, authentication, or response-quality details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Full live GLM 5.3 Flash agent quality suite
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_agent_suite) }}
        run: pnpm run test:agent:live

      - name: Upload live agent quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-quality-report
          path: |
            AGENT_QUALITY_REPORT.md
            .local/agent-quality-results.json
          if-no-files-found: ignore

  deploy-production:
    name: Deploy verified commit to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, live-agent-smoke]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy production
        id: deploy
        run: |
          deployment_url=$(npx --yes vercel@54.9.1 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed commit $GITHUB_SHA to $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm deployed commit metadata
        run: |
          echo "Expected runtime build: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Production alias: https://www.nbeh.io" >> "$GITHUB_STEP_SUMMARY"

  production-commerce-gate:
    name: Production Salla + Zid gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, deploy-production]
    if: ${{ always() && needs.verify.result == 'success' && (github.event_name == 'schedule' || needs.deploy-production.result == 'success') }}
    environment: production
    env:
      EXPECTED_GIT_SHA: ${{ github.sha }}
      PRODUCTION_SMOKE_URL: https://www.nbeh.io
      PRODUCTION_COMMERCE_LIVE_CHAT: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_commerce_chat)) && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for deployed commit and verify Salla + Zid
        run: node scripts/verify-production-commerce.mjs
